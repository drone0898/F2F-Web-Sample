# Google Cloud Build configuration
# Builds and deploys to Cloud Run

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/f2f-web:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/f2f-web:latest'
      - '.'

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/f2f-web:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/f2f-web:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'f2f-web'
      - '--image'
      - 'gcr.io/$PROJECT_ID/f2f-web:$COMMIT_SHA'
      - '--region'
      - 'asia-northeast3'  # Seoul region
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'F2F_ENGINE_URL=${_F2F_ENGINE_URL}'

# Substitution variables (set in Cloud Build trigger)
substitutions:
  _F2F_ENGINE_URL: 'https://f2f-engine-xxxxx-an.a.run.app'

# Build images to push
images:
  - 'gcr.io/$PROJECT_ID/f2f-web:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/f2f-web:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
